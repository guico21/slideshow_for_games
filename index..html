<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06121a" />
  <meta name="color-scheme" content="dark" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <meta name="description" content="Xmas Games Night — 3rd Edition. Countdown, fees & prizes, house rules and FAQs. 27 Dec, 19:00." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Xmas Games Night — 3rd Edition" />
  <meta property="og:description" content="Confirm by 28 Nov · Game night 27 Dec, 19:00 · €22 self-funded, surplus returned." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Xmas Games Night — 3rd Edition</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

  <!--
    CACHE-BUSTING LOADER
    1. Create version.json in this folder: { "version": "1" }
    2. On every deploy, bump that number. That's it.
    Every refresh fetches version.json fresh (no-store + timestamp),
    then loads all CSS/JS with ?v=<number>, so phones can never serve
    stale assets. If version.json is missing/offline, it falls back to
    a time-based version so the page still loads.
  -->
  <script>
    (function () {
      function boot(v) {
        ['style.css', 'landscape.css'].forEach(function (f) {
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = f + '?v=' + encodeURIComponent(v);
          document.head.appendChild(l);
        });
        var c = document.createElement('script');
        c.src = 'content.js?v=' + encodeURIComponent(v);
        c.onload = function () {
          var a = document.createElement('script');
          a.src = 'app.js?v=' + encodeURIComponent(v);
          document.body.appendChild(a);
        };
        document.body.appendChild(c);
      }

      fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) { boot(j && j.version ? j.version : 't' + Date.now()); })
        .catch(function () { boot('t' + Date.now()); });
    })();
  </script>
</head>
<body>
  <canvas id="snow" class="snow" aria-hidden="true"></canvas>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="lights" aria-hidden="true"></div>

  <!-- Optional snowy-hills / tree / waving-snowman scene (styled only by landscape.css) -->
  <div class="landscape" aria-hidden="true">
    <span class="ls-hill ls-hill--back"></span>
    <span class="ls-hill ls-hill--mid"></span>
    <span class="ls-hill ls-hill--front"></span>
    <span class="ls-tree">
      <i class="ls-trunk"></i>
      <i class="ls-tier ls-tier--3"></i>
      <i class="ls-tier ls-tier--2"></i>
      <i class="ls-tier ls-tier--1"></i>
      <i class="ls-lights"></i>
      <i class="ls-star"></i>
    </span>
    <span class="ls-snowman">
      <i class="sm-arm sm-arm--l"></i>
      <i class="sm-arm sm-arm--r"></i>
      <i class="sm-body"></i>
      <i class="sm-scarf"></i>
      <i class="sm-head"></i>
      <i class="sm-nose"></i>
      <i class="sm-hat"></i>
    </span>
  </div>

  <div class="progress" aria-hidden="true">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <main id="page" class="page"></main>
  <div class="cta-bar" id="ctaBar"></div>

  <noscript>
    <div class="noscript">🎄 Xmas Games Night needs JavaScript enabled to show the live countdown, funds and FAQs.</div>
  </noscript>
</body>
</html>
