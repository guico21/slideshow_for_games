<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06121a" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Xmas Games Night — 3rd Edition. Countdown, prize pot, game plan & FAQs. London Bridge, 27 Dec, 19:00." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Xmas Games Night — 3rd Edition" />
  <meta property="og:description" content="Confirm by 29 Nov · Game night 27 Dec, 19:00 · London Bridge. Winner takes the pot." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Xmas Games Night — 3rd Edition</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="snow" class="snow" aria-hidden="true"></canvas>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="lights" aria-hidden="true"></div>

  <header class="hud">
    <div class="hud-brand" aria-hidden="true">
      <span>🎄</span>
      <span class="brand-full">Xmas Games Night</span>
      <span class="brand-short">XGN</span>
    </div>
    <div class="hud-counter" id="slideCounter" aria-label="Current slide">01 / 01</div>
  </header>

  <div class="progress" aria-hidden="true">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <main id="stage" class="stage" aria-live="polite" aria-atomic="false"></main>

  <nav class="controls" aria-label="Slide navigation">
    <button id="prevBtn" class="btn" type="button" aria-label="Previous slide" disabled>
      <span aria-hidden="true">&#9664;</span>
    </button>
    <div class="dots" id="dots" aria-label="Choose a slide"></div>
    <button id="nextBtn" class="btn" type="button" aria-label="Next slide">
      <span aria-hidden="true">&#9654;</span>
    </button>
  </nav>

  <noscript>
    <div class="noscript">🎄 Xmas Games Night needs JavaScript enabled to show the live countdown, pot and FAQs.</div>
  </noscript>

  <!-- Keep slides.js before app.js. All event content lives in slides.js. -->
  <script src="slides.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
