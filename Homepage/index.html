<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06121a" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Xmas Games Night — 3rd Edition. Countdown, prize pot, game plan & FAQs. London Bridge, 27 Dec, 19:00." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Xmas Games Night — 3rd Edition" />
  <meta property="og:description" content="Confirm by 29 Nov · Game night 27 Dec, 19:00 · London Bridge. Winner takes the pot." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Xmas Games Night — 3rd Edition</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="snow" class="snow" aria-hidden="true"></canvas>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="lights" aria-hidden="true"></div>

  <!-- Scroll progress -->
  <div class="progress" aria-hidden="true">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- Single scrolling page, rendered from content.js -->
  <main id="page" class="page"></main>

  <!-- Always-visible confirm button -->
  <div class="cta-bar" id="ctaBar"></div>

  <noscript>
    <div class="noscript">🎄 Xmas Games Night needs JavaScript enabled to show the live countdown, pot and FAQs.</div>
  </noscript>

  <!-- Keep content.js before app.js. All copy & settings live in content.js. -->
  <script src="content.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
